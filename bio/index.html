<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QARAVAN: ссылки / links</title>
<meta name="description" content="Русскоязычное ЛГБТК+ сообщество в США. Russian-speaking LGBTQ+ community in the US.">
<meta property="og:title" content="QARAVAN: ссылки / links">
<meta property="og:description" content="Все ссылки QARAVAN в одном месте. All QARAVAN links in one place.">
<meta name="theme-color" content="#ffffff">
<link rel="preload" href="../assets/fonts/FiraSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/FiraSansCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/FiraSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Дизайн-система QARAVAN (ревизия 2026-09), как на events.qaravan.org: Fira Sans и
     Fira Sans Condensed, белая страница, квадратные формы, цвета бренда только флажками
     и метками, весь текст графитом на белом. */
  @font-face{font-family:"Fira Sans";src:url("../assets/fonts/FiraSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Fira Sans";src:url("../assets/fonts/FiraSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Fira Sans";src:url("../assets/fonts/FiraSans-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Fira Sans Condensed";src:url("../assets/fonts/FiraSansCondensed-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Fira Sans Condensed";src:url("../assets/fonts/FiraSansCondensed-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

  :root{
    color-scheme:light;
    --q-red:#ff3333; --q-orange:#ff9933; --q-yellow:#f8f36e; --q-green:#66cc66; --q-sky:#0099cc; --q-purple:#7668aa;
    --q-ink:#333333; --q-white:#ffffff; --q-muted:#5e5a53; --q-line:#ece8de; --q-edge:#8a857b;
    --accent:var(--q-sky);
    --font-brand:"Fira Sans","Helvetica Neue",Arial,sans-serif;
    --font-head:"Fira Sans Condensed","Arial Narrow","Fira Sans",Arial,sans-serif;
    --gutter:16px;
  }
  @media (min-width:640px){ :root{ --gutter:32px; } }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--q-white); color:var(--q-ink); font:400 16px/1.5 var(--font-brand); -webkit-font-smoothing:antialiased}
  h1,h2,h3,p{margin:0}
  button,input{font-family:inherit}
  [hidden]{display:none !important}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  ::selection{background:var(--q-yellow); color:var(--q-ink)}
  .wrap{max-width:1120px; margin:0 auto; padding:0 var(--gutter)}
  .qv-sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .flag{display:inline-block; flex:none; width:.62em; height:.62em; background:var(--f,var(--q-ink))}
  .flag.y{box-shadow:inset 0 0 0 1px var(--q-ink)}

  /* Шапка: логотип и переключатель RU / EN */
  .hdr{border-bottom:1px solid var(--q-line)}
  .hdr .wrap{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:4px 16px; min-height:68px; padding-top:6px; padding-bottom:6px}
  .home{display:inline-flex; align-items:center; min-height:44px}
  .home img{display:block; width:150px; height:auto}
  .tabs{display:inline-flex; border:2px solid var(--q-ink); background:var(--q-white)}
  .tab{min-height:40px; min-width:48px; padding:6px 14px; border:0; background:transparent; color:var(--q-ink); font:600 16px/1.15 var(--font-head); letter-spacing:.01em; cursor:pointer}
  .tab+.tab{box-shadow:inset 2px 0 0 var(--q-line)}
  .tab:hover{background:var(--q-line)}
  .tab[aria-selected="true"]{background:var(--q-ink); color:var(--q-white); box-shadow:none}
  .tab:focus-visible{outline-offset:-5px}
  .tab[aria-selected="true"]:focus-visible{outline-color:var(--q-yellow)}

  /* Раскладка: одна узкая колонка; при редактировании на широком экране рядом живой предпросмотр */
  .cols{max-width:560px; margin:0 auto}
  body.editing .cols{max-width:none; margin:0}
  .intro{padding:28px 0 20px}
  .eyebrow{display:inline-flex; align-items:center; gap:10px; font:600 13.5px/1.2 var(--font-head); letter-spacing:.1em; text-transform:uppercase}
  .eyebrow .flag{font-size:17px}
  h1{margin-top:12px; font:700 30px/1.08 var(--font-head); letter-spacing:-.005em; text-wrap:balance}
  @media (min-width:640px){ .intro{padding:44px 0 28px} h1{font-size:36px} }

  /* Ссылки: главная — тёмная кнопка, обычная — рамка, тихая — строка текста, заголовок — подпись раздела */
  .links{display:flex; flex-direction:column; gap:12px}
  .l{position:relative; display:flex; align-items:center; gap:14px; color:var(--q-ink); text-decoration:none}
  .l .flag{font-size:20px}
  .l-text{display:flex; flex-direction:column; align-items:flex-start; min-width:0; flex:1}
  .l-title{font:700 20px/1.15 var(--font-head); letter-spacing:-.003em; overflow-wrap:anywhere}
  .l-note{margin-top:4px; font:400 15px/1.4 var(--font-brand); color:var(--q-muted)}
  .l-badge{margin-bottom:6px; padding:1px 8px; background:var(--q-yellow); color:var(--q-ink); box-shadow:inset 0 0 0 1px var(--q-ink);
    font:600 12px/1.5 var(--font-head); letter-spacing:.08em; text-transform:uppercase}
  .l-go{flex:none; width:14px; height:14px}
  .l-feature{min-height:72px; padding:16px 18px; background:var(--q-ink); color:var(--q-white); border:2px solid var(--q-ink)}
  .l-feature .l-title{font-size:22px}
  .l-feature .l-note{color:rgba(255,255,255,.84)}
  .l-feature:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14)}
  .l-feature:focus-visible{outline-color:var(--q-sky); outline-offset:3px}
  .l-standard{min-height:60px; padding:12px 18px; background:var(--q-white); border:2px solid var(--q-line)}
  .l-standard:hover{border-color:var(--q-ink); background:var(--q-line)}
  .l-quiet{min-height:44px; padding:4px 2px 4px 4px; gap:10px}
  .l-quiet .l-title{font:600 16px/1.25 var(--font-brand); text-decoration:underline; text-decoration-color:var(--q-sky); text-decoration-thickness:2px; text-underline-offset:4px}
  .l-quiet .l-note{margin-top:0}
  .l-quiet .l-text{flex-direction:row; flex-wrap:wrap; align-items:baseline; gap:2px 10px}
  .l-quiet .l-badge{margin:0}
  .l-quiet:hover .l-title{text-decoration-color:currentColor}
  .l-quiet .l-go{margin-left:0}
  .l:active{transform:translateY(1px)}
  .l-head{display:flex; align-items:center; gap:12px; margin-top:16px; font:600 13.5px/1.2 var(--font-head); letter-spacing:.1em; text-transform:uppercase}
  .l-head:first-child{margin-top:0}
  .l-head::after{content:""; flex:1; border-top:1px solid var(--q-line)}
  .empty{font:400 17px/1.5 var(--font-brand); color:var(--q-muted)}

  /* Подвал */
  .ftr{margin-top:48px; border-top:1px solid var(--q-line)}
  .ftr .wrap{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 20px; padding-top:18px; padding-bottom:28px; font:400 14px/1.4 var(--font-brand); color:var(--q-muted)}
  .ftr a{display:inline-flex; align-items:center; min-height:44px; color:var(--q-ink); font:500 15px/1.3 var(--font-brand); text-decoration:none}
  .ftr a:hover{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px}
  .ftr .edit-open{min-height:44px; padding:0 4px; border:0; background:none; color:var(--q-muted); font:400 14px/1.3 var(--font-brand); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
  .ftr .edit-open:hover{color:var(--q-ink)}

  /* Загрузка: пока не пришли шрифты и список, содержимое скрыто, потом ссылки поднимаются одна за другой */
  html.loading main{visibility:hidden}
  @media (prefers-reduced-motion:no-preference){
    html.entering .l, html.entering .l-head, html.entering .intro{animation:q-rise .42s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i, 0) * 70ms)}
  }
  @keyframes q-rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

  /* Кнопки */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:8px 18px; border:2px solid var(--q-ink); background:var(--q-ink); color:var(--q-white);
    font:600 17px/1.15 var(--font-head); letter-spacing:.01em; text-decoration:none; cursor:pointer}
  .btn:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14)}
  .btn:active{transform:translateY(1px)}
  .btn.alt{background:var(--q-white); color:var(--q-ink)}
  .btn.alt:hover{background:var(--q-line); box-shadow:none}
  .btn[disabled]{background:var(--q-line); border-color:var(--q-line); color:var(--q-muted); cursor:default; box-shadow:none; transform:none}
  .btn svg{width:14px; height:14px; flex:none}

  /* Редактор */
  .edit-col{display:none}
  body.editing .edit-col{display:block}
  body.editing .pub-col{display:none}
  body.editing.previewing .pub-col{display:block}
  body.editing.previewing .edit-col{display:none}
  .ebar{position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:8px 0; background:var(--q-white); border-bottom:2px solid var(--q-ink)}
  .ebar-state{flex:1 1 110px; min-width:0}
  .ebar-state strong{display:block; font:700 20px/1.1 var(--font-head)}
  .ebar-state span{display:flex; align-items:center; gap:8px; margin-top:2px; font:400 14px/1.3 var(--font-brand); color:var(--q-muted)}
  .ebar-state .flag{font-size:14px}
  .ebar-btns{display:flex; flex-wrap:wrap; gap:8px}
  .ehelp{margin:14px 0 4px; font:400 15px/1.45 var(--font-brand); color:var(--q-muted)}
  .eadd{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0}
  .emore{margin-bottom:0}
  .emore .btn{min-height:40px; padding:6px 14px; font-size:16px}
  .ebar .btn{min-height:44px}
  .rows{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
  .row{background:var(--q-white); border:1px solid var(--q-line)}
  .row.open{border:2px solid var(--q-ink)}
  .row.is-hidden .row-title{color:var(--q-muted)}
  .row.dragging{position:relative; z-index:10; border:2px solid var(--q-ink); box-shadow:0 10px 28px rgba(0,0,0,.2)}
  body.is-dragging{user-select:none; -webkit-user-select:none; cursor:grabbing}
  .row-bar{display:flex; align-items:stretch}
  .grip{flex:none; width:44px; min-height:60px; border:0; background:none; color:var(--q-muted); cursor:grab; touch-action:none; display:grid; place-items:center}
  .grip:hover{color:var(--q-ink); background:var(--q-line)}
  .grip svg{width:16px; height:20px}
  .row-main{flex:1; min-width:0; padding:8px 8px; border:0; background:none; text-align:left; cursor:pointer; color:inherit}
  .row-main:hover{background:var(--q-line)}
  .row-title{display:block; font:700 18px/1.2 var(--font-head); overflow-wrap:anywhere}
  .chips{display:flex; flex-wrap:wrap; gap:4px 6px; margin-top:4px}
  .chip{padding:0 7px; border:1px solid var(--q-edge); font:600 12px/1.6 var(--font-head); letter-spacing:.06em; text-transform:uppercase; color:var(--q-muted)}
  .chip.warn{background:var(--q-yellow); border-color:var(--q-ink); color:var(--q-ink)}
  .mv{flex:none; width:40px; border:0; background:none; color:var(--q-ink); cursor:pointer; display:grid; place-items:center}
  .mv:hover{background:var(--q-line)}
  .mv[disabled]{color:var(--q-line); cursor:default; background:none}
  .mv svg{width:14px; height:14px}
  .row-body{display:grid; gap:16px; padding:6px 14px 18px}
  .f label, .f .lbl{display:block; margin-bottom:4px; font:600 14px/1.3 var(--font-brand)}
  .f .hint{margin-top:4px; font:400 13.5px/1.4 var(--font-brand); color:var(--q-muted)}
  .pair{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .in{display:block; width:100%; min-height:44px; padding:8px 12px; border:2px solid var(--q-edge); border-radius:0; background:var(--q-white); color:var(--q-ink); font:400 16px/1.3 var(--font-brand)}
  .in:focus{border-color:var(--q-ink)}
  .in.bad{border-color:var(--q-red)}
  .seg{display:flex; flex-wrap:wrap; gap:8px}
  .opt{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:6px 14px; border:2px solid var(--q-line); background:var(--q-white); color:var(--q-ink); font:600 15px/1.2 var(--font-brand); cursor:pointer}
  .opt .flag{font-size:16px}
  .opt:hover{border-color:var(--q-ink)}
  .opt[aria-pressed="true"]{background:var(--q-ink); border-color:var(--q-ink); color:var(--q-white)}
  .check{display:flex; align-items:center; gap:10px; min-height:44px; font:600 15px/1.3 var(--font-brand); cursor:pointer}
  .check input{width:22px; height:22px; margin:0; accent-color:var(--q-ink)}
  .rowacts{display:flex; flex-wrap:wrap; gap:8px; padding-top:4px; border-top:1px solid var(--q-line); margin-top:2px; padding-top:14px}
  .rowacts .del{margin-left:auto}
  @media (min-width:980px){
    body.editing .cols{display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:40px; align-items:start}
    body.editing .pub-col{display:block; position:sticky; top:12px; border:1px solid var(--q-line); padding:0 20px 24px; max-height:calc(100vh - 24px); overflow:auto}
    body.editing .pub-col .intro{padding:22px 0 16px}
    body.editing.previewing .edit-col{display:block}
    #pv-toggle{display:none}
  }
  /* Окна и сообщение */
  dialog{width:calc(100% - 32px); max-width:520px; padding:0; border:2px solid var(--q-ink); background:var(--q-white); color:var(--q-ink)}
  dialog::backdrop{background:rgba(51,51,51,.6)}
  .dlg{padding:18px 20px 20px}
  .dlg h2{font:700 24px/1.1 var(--font-head); letter-spacing:-.005em}
  .dlg .body{display:grid; gap:14px; margin-top:14px}
  .dlg .acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px}
  .dlg .msg{font:600 15px/1.4 var(--font-brand)}
  .dlg .msg.err{display:flex; gap:8px; align-items:flex-start}
  .dlg .msg .flag{margin-top:.45em; font-size:14px}
  .vers{list-style:none; margin:0; padding:0; max-height:50vh; overflow:auto; border-top:1px solid var(--q-line)}
  .vers li{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--q-line)}
  .vers .vi{flex:1; min-width:0; font:400 14px/1.35 var(--font-brand); color:var(--q-muted)}
  .vers .vi b{display:block; color:var(--q-ink); font:600 16px/1.3 var(--font-brand)}
  .toast{position:fixed; left:50%; bottom:20px; z-index:50; transform:translateX(-50%); display:flex; align-items:center; gap:14px; max-width:calc(100% - 32px); padding:12px 16px; background:var(--q-ink); color:var(--q-white); font:600 15px/1.35 var(--font-brand)}
  .toast .flag{font-size:14px}
  .toast button{min-height:36px; padding:4px 12px; border:2px solid var(--q-white); background:transparent; color:var(--q-white); font:600 15px/1.2 var(--font-head); cursor:pointer}
  @media (prefers-reduced-motion:reduce){ *{scroll-behavior:auto !important} }
</style>
<script>(function () { document.documentElement.classList.add("loading"); })();</script>
</head>
<body>
<header class="hdr">
  <div class="wrap">
    <a class="home" href="https://qaravan.org"><img src="../assets/logo-wordmark.svg" width="150" height="31" alt="qaravan"></a>
    <div class="tabs" id="tabs" role="tablist" aria-label="Язык / Language"></div>
  </div>
</header>
<main class="wrap">
  <div class="ebar" id="ebar" hidden></div>
  <div class="cols">
    <div class="edit-col" id="editor"></div>
    <div class="pub-col">
      <section class="intro">
        <div class="eyebrow"><span class="flag" style="--f:var(--q-sky)"></span>@qaravan_org</div>
        <h1 id="title"></h1>
      </section>
      <div class="links" id="links"></div>
      <noscript><p class="empty">QARAVAN: <a href="https://givebutter.com/qaravan">givebutter.com/qaravan</a>, <a href="https://events.qaravan.org">events.qaravan.org</a></p></noscript>
    </div>
  </div>
</main>
<footer class="ftr">
  <div class="wrap">
    <a href="https://qaravan.org">qaravan.org</a>
    <span>© 2026 QARAVAN</span>
    <button type="button" class="edit-open" id="edit-open"></button>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
// ══════════════════════════════════════════════════════════════
//  Ссылки для Instagram bio: events.qaravan.org/bio/  (на qaravan.org/insta ведёт переадресация Wix)
//
//  Страница статическая, список ссылок хранится на сервере (Cloudflare Worker, папка bio-worker/
//  в репозитории). Пароль команды знает только сервер. Пока сервер не подключён (API_URL пуст)
//  или недоступен, страница показывает список из bio/links.json.
//  Команда правит ссылки кнопкой «Редактировать ссылки» внизу страницы; руками здесь ничего
//  менять не нужно. Подробности: AGENTS.md и README.md, раздел «Ссылки для Instagram bio».
// ══════════════════════════════════════════════════════════════
const API_URL = "";   // адрес воркера, например "https://qaravan-bio.<аккаунт>.workers.dev" (без слэша в конце)
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
const API = LOCAL ? location.origin : API_URL;   // локально страницу и воркер отдаёт bio-worker/dev-server.mjs

// Счётчик GoatCounter, как на events.qaravan.org: нажатия на ссылки и просмотры. Без cookie и без
// личных данных; не считаем при «Do Not Track» / Global Privacy Control, вне events.qaravan.org и пока
// человек редактирует. Тот же адрес сайта, что COUNTER в ../index.html; пусто — счётчик выключен.
const COUNTER = "";
const COUNT_ON = () => !!COUNTER && location.hostname === "events.qaravan.org" && !S.editing
  && navigator.doNotTrack !== "1" && window.doNotTrack !== "1" && navigator.globalPrivacyControl !== true;
function count(path, title, event) {
  if (!COUNT_ON()) return;
  const q = new URLSearchParams({ p: path, t: title, e: event ? "true" : "false" });
  if (!event) { q.set("s", [screen.width, screen.height, devicePixelRatio || 1].join(",")); q.set("r", document.referrer); }
  q.set("rnd", Math.random().toString(36).slice(2));
  const url = `https://${COUNTER}.goatcounter.com/count?${q}`;
  try { fetch(url, { mode: "no-cors", credentials: "omit", keepalive: true }); } catch (_) { new Image().src = url; }
}
function countOnce(what, title) {
  let first = true;
  try { const k = "qaravan-counted-" + what; if (localStorage.getItem(k)) first = false; else localStorage.setItem(k, "1"); } catch (_) {}
  if (first) count(what + "-unique-people", title, true);
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-count]");
  if (!el || !COUNT_ON()) return;
  count(el.dataset.count, el.dataset.countTitle || el.dataset.count, true);
  countOnce("bio", "Bio: different people who clicked a link (once per device)");
}, true);

// ── Тексты ──
const T = {
  ru: {
    doc: "QARAVAN: ссылки", tagline: "Русскоязычное ЛГБТК+ сообщество в США", empty: "Скоро здесь появятся ссылки.",
    newTab: "(откроется в новой вкладке)", edit: "Редактировать ссылки",
    signInTitle: "Вход для команды", password: "Пароль", yourName: "Ваше имя для истории (необязательно)", signIn: "Войти", cancel: "Отмена", close: "Закрыть",
    wrongPassword: "Пароль не подошёл.", tooMany: "Слишком много попыток. Попробуйте через 15 минут.",
    offline: "Не получилось связаться с сервером. Попробуйте ещё раз.", notReady: "Редактирование ещё не подключено: у страницы нет сервера.",

  const isLink = it.type === "link", p = "f-" + id + "-";
  const body = h("div", { class: "row-body" });
  body.append(h("div", { class: "pair" }, field(t().titleEn, textIn(it, "title.en", p + "te"), null, p + "te"), field(t().titleRu, textIn(it, "title.ru", p + "tr"), null, p + "tr")));
  if (isLink) {
    body.append(field(t().url, textIn(it, "url", p + "u", { max: "2000", attrs: { type: "url", inputmode: "url", placeholder: "https://" } }), null, p + "u"));
    body.append(h("div", { class: "f" }, h("span", { class: "lbl" }, t().importance), segment(["feature", "standard", "quiet"], it.tier, v => { it.tier = v; renderEditor(); touch(); }, { text: v => t().tier[v] })));
    body.append(h("div", { class: "pair" },
      field(t().noteEn, textIn(it, "note.en", p + "ne", { max: "160" }), t().noteHint, p + "ne"), field(t().noteRu, textIn(it, "note.ru", p + "nr", { max: "160" }), t().noteHint, p + "nr")));
    body.append(h("div", { class: "pair" },
      field(t().badgeEn, textIn(it, "badge.en", p + "be", { max: "24" }), t().badgeHint, p + "be"), field(t().badgeRu, textIn(it, "badge.ru", p + "br", { max: "24" }), null, p + "br")));
    body.append(h("div", { class: "f" }, h("span", { class: "lbl" }, t().flagLabel),
      segment(["", "red", "orange", "yellow", "green", "sky", "purple"], it.flag, v => { it.flag = v; renderEditor(); touch(); }, { flag: true, text: v => v ? t().flags[v] : t().flagNone })));
  }
  const hid = h("input", { type: "checkbox", checked: it.hidden });
  hid.addEventListener("change", () => { it.hidden = hid.checked; row.classList.toggle("is-hidden", it.hidden); row.querySelector(".chips").replaceChildren(...chipsFor(it)); touch(); });
  body.append(h("label", { class: "check" }, hid, t().hideIt));
  const date = (key, label, pid) => { const el = h("input", { class: "in", type: "date", value: it[key] }); el.addEventListener("change", () => { it[key] = el.value; row.querySelector(".chips").replaceChildren(...chipsFor(it)); touch(); }); return field(label, el, null, pid); };
  body.append(h("div", { class: "f" }, h("div", { class: "pair" }, date("from", t().from, p + "df"), date("until", t().until, p + "du")), h("p", { class: "hint" }, t().scheduleHint)));
  body.append(h("div", { class: "rowacts" },
    h("button", { type: "button", class: "btn alt", onclick: () => duplicateItem(id) }, t().dup),
    h("button", { type: "button", class: "btn alt del", onclick: () => deleteItem(id) }, t().del)));
  row.append(body);
  return row;
}

function renderEditor() {
  const ed = $("#editor"), bar = $("#ebar"), keepScroll = scrollY;
  bar.hidden = false;
  bar.replaceChildren(
    h("div", { class: "ebar-state" }, h("strong", {}, t().editing), h("span", { id: "ebar-status" })),
    h("div", { class: "ebar-btns" },
      h("button", { type: "button", class: "btn", id: "pub-btn", onclick: () => publish() }, t().publish),
      h("button", { type: "button", class: "btn alt", id: "pv-toggle", onclick: () => { document.body.classList.toggle("previewing"); scrollTo(0, 0); } }, previewLabel())));
  ed.replaceChildren(
    h("div", { class: "eadd emore" },
      h("button", { type: "button", class: "btn alt", onclick: openHistory }, t().history),
      h("button", { type: "button", class: "btn alt", onclick: exportCopy }, t().exportCopy),
      h("button", { type: "button", class: "btn alt", onclick: leaveEditing }, t().signOut)),
    h("p", { class: "ehelp" }, t().help),
    h("div", { class: "eadd" },
      h("button", { type: "button", class: "btn alt", onclick: () => addItem("link") }, "+ " + t().addLink),
      h("button", { type: "button", class: "btn alt", onclick: () => addItem("heading") }, "+ " + t().addHeading)),
    h("ol", { class: "rows", id: "rows" }, S.items.map(rowEl)));
  updateBar();
  scrollTo(0, keepScroll);
}
const previewLabel = () => document.body.classList.contains("previewing") ? t().backToEdit : t().preview;
// Кнопка предпросмотра меняет подпись вместе с режимом
new MutationObserver(() => { const pv = $("#pv-toggle"); if (pv) pv.textContent = previewLabel(); }).observe(document.body, { attributes: true, attributeFilter: ["class"] });

function addItem(type) {
  const it = normalize({ type, tier: "standard" });
  S.items.unshift(it); S.openId = it.id;
  renderEditor(); touch();
  const first = document.querySelector(`#f-${it.id}-te`); if (first) first.focus();
}
function moveItem(id, d, keepFocus) {
  const i = S.items.findIndex(x => x.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= S.items.length) return;
  [S.items[i], S.items[j]] = [S.items[j], S.items[i]];
  renderEditor(); touch();
  if (keepFocus) { const g = document.querySelector(`.row[data-id="${id}"] .grip`); g && g.focus(); }
}
function duplicateItem(id) {
  const i = S.items.findIndex(x => x.id === id); if (i < 0) return;
  const c = clone(S.items[i]); c.id = newId();
  S.items.splice(i + 1, 0, c); S.openId = c.id;
  renderEditor(); touch();
}
function deleteItem(id) {
  const i = S.items.findIndex(x => x.id === id); if (i < 0) return;
  const [gone] = S.items.splice(i, 1);
  if (S.openId === id) S.openId = null;
  renderEditor(); touch();
  toast(t().deleted, { action: { label: t().undo, run: () => { S.items.splice(Math.min(i, S.items.length), 0, gone); renderEditor(); touch(); } } });
}

// Перетаскивание за ручку: работает мышью и пальцем; у края экрана страница сама прокручивается
function startDrag(ev, row) {
  if (ev.button) return;
  ev.preventDefault();
  const grip = ev.currentTarget, list = row.parentElement, rect = row.getBoundingClientRect();
  const grab = ev.clientY - rect.top; let y = ev.clientY, raf = 0, live = true;
  grip.setPointerCapture(ev.pointerId);
  row.classList.add("dragging"); document.body.classList.add("is-dragging");
  const place = () => {
    row.style.display = "none";
    const cy = y - grab + rect.height / 2;
    const next = [...list.children].filter(r => r !== row).find(r => { const b = r.getBoundingClientRect(); return cy < b.top + b.height / 2; }) || null;
    row.style.display = "";
    if (row.nextElementSibling !== next) list.insertBefore(row, next);
    row.style.transform = "";
    row.style.transform = `translateY(${y - grab - row.getBoundingClientRect().top}px)`;
  };
  const loop = () => {
    if (!live) return;
    if (y < 90) scrollBy(0, -14); else if (y > innerHeight - 90) scrollBy(0, 14);
    place(); raf = requestAnimationFrame(loop);
  };
  const move = e => { y = e.clientY; };
  const end = () => {
    if (!live) return; live = false; cancelAnimationFrame(raf);
    grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", end); grip.removeEventListener("pointercancel", end);
    row.classList.remove("dragging"); document.body.classList.remove("is-dragging"); row.style.transform = "";
    const order = [...list.children].map(r => r.dataset.id), byId = new Map(S.items.map(x => [x.id, x]));
    S.items = order.map(id => byId.get(id));
    renderEditor(); touch();
  };
  grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", end); grip.addEventListener("pointercancel", end);
  loop();
}

function firstProblem() {
  for (const it of S.items) {
    if (it.type === "link") it.url = fixUrl(it.url);
    if (!it.title.en.trim() && !it.title.ru.trim()) return { it, msg: t().needTitle, field: "te" };
    if (it.type === "link" && !safeUrl(it.url)) return { it, msg: t().needUrl, field: "u" };
  }
  return null;
}
async function publish(force = false) {
  if (S.busy) return;
  const bad = firstProblem();
  if (bad) {
    S.openId = bad.it.id; renderEditor();
    const el = document.querySelector(`#f-${bad.it.id}-${bad.field}`); if (el) { el.classList.add("bad"); el.focus(); }
    toast(bad.msg, { error: true }); return;
  }
  S.busy = true; $("#pub-btn").textContent = t().publishing; updateBar();
  const r = await api("/links", { method: "PUT", auth: true, body: { items: S.items, version: S.base, editor: S.name, force } });
  S.busy = false; $("#pub-btn").textContent = t().publish;
  if (r.ok) {
    S.base = r.data.version; S.items = r.data.items.map(normalize); S.saved = snap(S.items); S.updated = r.data.updated;
    try { localStorage.setItem("qaravan-bio-cache", JSON.stringify(S.items.filter(it => visibleNow(it)))); } catch (_) {}
    renderEditor(); renderLinks(); toast(t().published);
  } else if (r.status === 409) {
    modal(t().conflictTitle, [h("p", {}, t().conflictText)],
      [{ label: t().loadTheirs, primary: true, run: () => { S.base = r.data.current.version; S.items = r.data.current.items.map(normalize); S.saved = snap(S.items); renderEditor(); renderLinks(); } },
       { label: t().overwrite, run: () => publish(true) }, { label: t().cancel }]);
  } else if (r.status === 401) { signOut(); openLogin(t().sessionExpired); }
  else if (r.status === 400) toast((r.data && r.data.message) || t().offline, { error: true });
  else toast(t().offline, { error: true });
  updateBar();
}
async function openHistory() {
  const r = await api("/history", { auth: true });
  if (r.status === 401) { signOut(); openLogin(t().sessionExpired); return; }
  if (!r.ok) { toast(t().offline, { error: true }); return; }
  const when = iso => new Date(iso).toLocaleString(S.lang === "ru" ? "ru-RU" : "en-US", { dateStyle: "medium", timeStyle: "short", timeZone: "America/New_York" });
  const list = r.data.versions;
  modal(t().historyTitle,
    [list.length ? h("ul", { class: "vers" }, list.map(v => h("li", {},
      h("div", { class: "vi" }, h("b", {}, `${t().version(v.version)}${v.version === S.base ? ", " + t().current : ""}`), `${when(v.updated)}, ${v.editor || t().noName}, ${t().nLinks(v.count)}`),
      v.version === S.base ? null : h("button", { type: "button", class: "btn alt", onclick: async ev => {
        const s = await api("/history/" + v.version, { auth: true });
        if (!s.ok) { toast(t().offline, { error: true }); return; }
        ev.target.closest("dialog").close();
        S.items = s.data.items.map(normalize); S.openId = null; renderEditor(); touch(); toast(t().restored(v.version));
      } }, t().restore)))) : h("p", { class: "empty" }, t().historyEmpty)],
    [{ label: t().close, primary: true }]);
}
function exportCopy() {
  const blob = new Blob([JSON.stringify({ version: S.base, items: S.items }, null, 2) + "\n"], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: "qaravan-bio-links.json" });
  document.body.append(a); a.click(); a.remove();
}
window.addEventListener("beforeunload", ev => { if (S.editing && dirty()) { ev.preventDefault(); ev.returnValue = ""; } });

// ── События страницы ──
document.addEventListener("click", ev => {
  const tab = ev.target.closest("[data-lang]");
  if (tab) { S.lang = tab.dataset.lang; try { localStorage.setItem(LANG_KEY, S.lang); } catch (_) {} renderAll(); const n = document.querySelector(`[data-lang="${S.lang}"]`); n && n.focus(); }
});
document.addEventListener("keydown", ev => {
  const tab = ev.target.closest && ev.target.closest(".tab");
  if (tab && (ev.key === "ArrowLeft" || ev.key === "ArrowRight")) { ev.preventDefault(); const n = document.querySelector(`.tab[data-lang="${S.lang === "ru" ? "en" : "ru"}"]`); n && n.click(); }
});
$("#edit-open").addEventListener("click", openEditor);

// ── Запуск: ждём шрифты (не дольше 2,5 с) и список, потом показываем ──
(async function start() {
  renderChrome();
  const fonts = !document.fonts ? sleep(0) : Promise.race([Promise.all([document.fonts.load('400 16px "Fira Sans"'), document.fonts.load('600 16px "Fira Sans"'), document.fonts.load('700 20px "Fira Sans Condensed"')]), sleep(2500)]).catch(() => {});
  const [items] = await Promise.all([loadPublic(), fonts]);
  S.public = items;
  renderLinks();
  const c = document.documentElement.classList;
  c.add("entering"); c.remove("loading");
  setTimeout(() => c.remove("entering"), 1400);
  count("/bio/", "events.qaravan.org/bio (link in bio)", false);
  if (location.hash === "#edit") openEditor();
})();
</script>
