<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёба в США: что вам подходит. Тест QARAVAN</title>
<meta name="description" content="Ответьте на несколько вопросов и получите стипендии и программы, которые вам подходят, свои шаги и план в PDF. Для тех, кто живёт в Нью-Йорке и ждёт решения по убежищу.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://events.qaravan.org/quiz/">
<meta property="og:title" content="Учёба в США: какие стипендии и программы вам подходят">
<meta property="og:description" content="Тест QARAVAN для тех, кто ждёт решения по убежищу: стипендии, шаги и план в PDF.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/favicon-q-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/favicon-q.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/favicon-q-180.png">
<link rel="preload" href="/assets/fonts/FiraSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/FiraSansCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:"Fira Sans";src:url("/assets/fonts/FiraSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Fira Sans";src:url("/assets/fonts/FiraSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Fira Sans";src:url("/assets/fonts/FiraSans-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Fira Sans Condensed";src:url("/assets/fonts/FiraSansCondensed-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Fira Sans Condensed";src:url("/assets/fonts/FiraSansCondensed-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
  :root{
    color-scheme:light;
    --q-ink:#333333; --q-muted:#5e5a53; --q-line:#ece8de; --q-edge:#8a857b; --q-white:#ffffff;
    --q-red:#ff3333; --q-orange:#ff9933; --q-yellow:#f8f36e; --q-green:#66cc66; --q-sky:#0099cc; --q-purple:#7668aa;
    --font-head:"Fira Sans Condensed","Fira Sans",system-ui,sans-serif;
    --font-brand:"Fira Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--q-white); color:var(--q-ink); font:400 17px/1.55 var(--font-brand)}
  a{color:inherit; text-decoration:underline; text-decoration-color:var(--q-sky); text-decoration-thickness:2px; text-underline-offset:3px}
  a:hover{text-decoration-color:var(--q-ink)}
  :focus-visible{outline:2px solid var(--q-sky); outline-offset:2px}
  h1:focus{outline:none}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  .top{border-bottom:1px solid var(--q-line)}
  .top .in{max-width:760px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:16px}
  .top img{display:block; height:22px; width:auto}
  .top a.guide{font:600 15px/1.2 var(--font-head); letter-spacing:.01em}
  main{max-width:760px; margin:0 auto; padding:28px 16px 64px}

  .flag{display:inline-block; flex:none; width:.62em; height:.62em; background:var(--f,var(--q-ink))}
  .eyebrow{display:inline-flex; align-items:center; gap:10px; margin:0; font:600 13.5px/1.2 var(--font-head); letter-spacing:.1em; text-transform:uppercase}
  .eyebrow .flag{font-size:17px}
  .eyebrow.sm{font-size:11.5px; gap:8px; color:var(--q-muted)}
  .eyebrow.sm .flag{font-size:13px}
  h1{margin:12px 0 0; font:700 34px/1.08 var(--font-head); letter-spacing:-.005em; text-wrap:balance}
  .lead{margin:16px 0 0; font-size:18px}
  .hint{margin:10px 0 0; color:var(--q-muted)}
  .small{font-size:14.5px; color:var(--q-muted)}

  .btn{display:inline-flex; align-items:center; justify-content:center; min-height:50px; padding:12px 24px; border:0; border-radius:0;
    background:var(--q-ink); color:var(--q-white); font:600 17px/1.15 var(--font-head); letter-spacing:.01em; cursor:pointer; text-decoration:none}
  .btn:hover{background:#000}
  .btn.ghost{background:var(--q-white); color:var(--q-ink); box-shadow:inset 0 0 0 1.5px var(--q-ink)}
  .btn.ghost:hover{background:var(--q-line)}

  .intro .btn{margin-top:28px; min-width:200px}
  .ticks{margin:24px 0 0; padding:0; list-style:none}
  .ticks li{position:relative; padding-left:24px; margin:10px 0}
  .ticks li::before{content:""; position:absolute; left:0; top:.55em; width:9px; height:9px; background:var(--q-red)}
  .intro .small{margin-top:20px}

  .bar{height:4px; background:var(--q-line); margin:0 0 24px}
  .bar i{display:block; height:100%; background:var(--q-ink); transition:width .25s ease}
  .opts{border:0; margin:22px 0 0; padding:0; display:grid; gap:8px}
  .opt{display:flex; align-items:flex-start; gap:14px; padding:14px 16px; border:1px solid var(--q-line); cursor:pointer; background:var(--q-white); transition:border-color .12s}
  .opt:hover{border-color:var(--q-edge)}
  .opt input{position:absolute; opacity:0; width:1px; height:1px}
  .opt .box{flex:none; width:20px; height:20px; margin-top:2px; border:1.5px solid var(--q-ink); background:var(--q-white); position:relative}
  .opt .ot{display:block; font-size:17px; line-height:1.35}
  .opt small{display:block; margin-top:3px; font-size:14.5px; color:var(--q-muted)}
  .opt:has(input:checked){border-color:var(--q-ink); box-shadow:inset 0 0 0 1px var(--q-ink)}
  .opt input:checked + .box{background:var(--q-ink)}
  .opt input:checked + .box::after{content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid var(--q-white); border-width:0 2px 2px 0; transform:rotate(45deg)}
  .opt input:focus-visible + .box{outline:2px solid var(--q-sky); outline-offset:2px}
  .sel,.num{display:block; width:100%; margin-top:22px; min-height:52px; padding:12px 14px; border:1.5px solid var(--q-ink); border-radius:0; background:var(--q-white); color:var(--q-ink); font:400 18px/1.3 var(--font-brand)}
  .num{max-width:200px}
  .err{margin:14px 0 0; font-weight:600}
  .nav{display:flex; gap:10px; margin-top:28px}
  .nav .btn{flex:1 1 0}
  .nav .ghost{flex:0 0 auto}

  .res-head .actions,.end .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
  .pdf-status{min-height:1.4em; margin:10px 0 0}
  .toc{display:flex; flex-wrap:wrap; gap:6px 20px; margin:26px 0 0; padding:12px 0; border-top:1px solid var(--q-line); border-bottom:1px solid var(--q-line); font:600 16px/1.2 var(--font-head); letter-spacing:.01em}
  .blk{margin-top:40px}
  .blk h2{margin:0 0 14px; font:700 26px/1.12 var(--font-head); letter-spacing:-.005em}
  .facts{margin:0; padding:0; list-style:none}
  .facts li{position:relative; padding-left:22px; margin:0 0 12px}
  .facts li::before{content:""; position:absolute; left:0; top:.6em; width:8px; height:8px; background:var(--q-ink)}
  .soon{margin:0; padding:0; list-style:none; border-top:1px solid var(--q-line)}
  .soon li{display:flex; gap:16px; padding:10px 0; border-bottom:1px solid var(--q-line)}
  .soon .d{flex:0 0 96px; font:700 17px/1.35 var(--font-head)}
  .soon .n small{display:block; color:var(--q-muted); font-size:14.5px}
  .phase{margin:22px 0 10px; display:flex; align-items:center; gap:10px; font:600 13.5px/1.2 var(--font-head); letter-spacing:.1em; text-transform:uppercase}
  .phase::before{content:""; width:10px; height:10px; background:var(--q-red)}
  .steps{margin:0; padding:0; list-style:none; counter-reset:none}
  .steps li{position:relative; padding:0 0 0 44px; margin:0 0 18px}
  .steps li::before{content:counter(list-item); position:absolute; left:0; top:0; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    background:var(--q-ink); color:var(--q-white); font:700 15px/1 var(--font-head)}
  .steps p{margin:8px 0 0; font-size:16px}
  .steps details{border-bottom:1px solid var(--q-line); padding-bottom:12px}
  .steps .st{display:flex; align-items:flex-start; gap:12px; min-height:30px; padding-top:3px; font-weight:600; line-height:1.35; cursor:pointer; list-style:none}
  .steps .st::-webkit-details-marker{display:none}
  .steps .st::after{content:""; flex:none; margin:6px 4px 0 auto; width:8px; height:8px; border:solid var(--q-ink); border-width:0 2px 2px 0; transform:rotate(45deg)}
  .steps details[open] .st::after{transform:translateY(4px) rotate(-135deg)}
  .steps li{margin-bottom:12px}
  .grp{border-top:1px solid var(--q-line); padding:4px 0 8px}
  .grp > summary{display:flex; align-items:center; gap:12px; padding:14px 0 10px; cursor:pointer; list-style:none; font:700 21px/1.2 var(--font-head)}
  .grp > summary::-webkit-details-marker{display:none}
  .grp > summary::after{content:""; margin-left:auto; width:9px; height:9px; border:solid var(--q-ink); border-width:0 2px 2px 0; transform:rotate(45deg); transition:transform .15s}
  .grp[open] > summary::after{transform:rotate(-135deg)}
  .grp .cnt{font:600 14px/1 var(--font-head); padding:5px 8px; box-shadow:inset 0 0 0 1px var(--q-ink)}
  .grp > .small{margin:0 0 12px}
  .cards{display:grid; gap:12px}
  .card{border:1px solid var(--q-line); padding:16px 18px; scroll-margin-top:16px}
  .card.dim{opacity:.7}
  .card h3{margin:10px 0 6px; font:700 21px/1.18 var(--font-head); letter-spacing:-.005em}
  .card p{margin:6px 0 0}
  .card .amt{font-weight:600}
  .card .dl{font-weight:600}
  .card .dl.urgent::before{content:"Скоро"; display:inline-block; margin-right:8px; padding:2px 6px; background:var(--q-ink); color:var(--q-white); font:600 12px/1.3 var(--font-head); letter-spacing:.06em; text-transform:uppercase; vertical-align:2px}
  .card .when,.card .who{font-size:15.5px}
  .card .when{color:var(--q-muted)}
  .card .why{font-size:15px}
  .card .why span{font-weight:600}
  .card .warn{font-size:15px; font-weight:600}
  .card .url{font-size:14px; word-break:break-all; color:var(--q-muted)}
  .card .more{margin-top:10px}
  .card .more summary{display:inline-flex; align-items:center; gap:8px; cursor:pointer; list-style:none; font:600 15px/1.3 var(--font-head); letter-spacing:.01em;
    text-decoration:underline; text-decoration-color:var(--q-sky); text-decoration-thickness:2px; text-underline-offset:3px}
  .card .more summary::-webkit-details-marker{display:none}
  .card .more summary::after{content:""; width:7px; height:7px; border:solid var(--q-ink); border-width:0 2px 2px 0; transform:translateY(-2px) rotate(45deg)}
  .card .more[open] summary::after{transform:translateY(2px) rotate(-135deg)}
  .nofit{margin:0; padding:0; list-style:none}
  .nofit li{padding:10px 0; border-bottom:1px solid var(--q-line); font-size:16px}
  .end{padding-top:28px; border-top:1px solid var(--q-line)}
  @media (max-width:520px){
    body{font-size:16.5px}
    h1{font-size:29px}
    .blk h2{font-size:23px}
    .lead{font-size:17px}
    .soon li{flex-direction:column; gap:2px}
    .soon .d{flex:none}
    .res-head .actions .btn,.end .actions .btn{flex:1 1 100%}
  }
  @media (prefers-reduced-motion:reduce){ .bar i,.grp > summary::after{transition:none} }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="/quiz/" aria-label="QARAVAN, начать тест заново"><img src="/assets/logo-wordmark.svg" alt="QARAVAN" width="106" height="22"></a>
  <a class="guide" href="/oct19/">Полный гид</a>
</div></header>
<main id="app" aria-live="off">
  <noscript><p>Тест работает только с включённым JavaScript. Все сведения есть в <a href="/oct19/">полном гиде в PDF</a>.</p></noscript>
</main>
<script src="programs.js"></script>
<script src="app.js"></script>
</body>
</html>
