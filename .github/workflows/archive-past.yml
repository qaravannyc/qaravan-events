# Робот списка событий, каждые 15 минут:
# 1. robot/archive-past.mjs переносит прошедшие даты из EVENTS в ARCHIVE;
# 2. robot/from-site.mjs переписывает EVENTS по событиям qaravan.org (https://www.qaravan.org/data/site-events.json):
#    один источник событий для qaravan.org и events.qaravan.org (владелец, 2026-11-07);
# 3. robot/build-calendar.mjs пересобирает календари .ics.
# Если что-то изменилось, коммитит в main; GitHub Pages пересобирает events.qaravan.org сам через 1–2 минуты.
name: archive past events
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub часто запускает по расписанию с опозданием
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: показать, что переедет в архив и что изменится по qaravan.org, ничего не записывать"
        type: boolean
        default: false

permissions:
  contents: write

# Два прогона сразу (ручной + по расписанию) не должны толкаться на push.
concurrency:
  group: archive-past
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node robot/archive-past.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      - run: node robot/from-site.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      - run: node robot/build-calendar.mjs
        if: ${{ !inputs.dry_run }}
      - name: Commit and push if anything changed
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- index.html qaravan-events-en.ics qaravan-events-ru.ics; then echo "Ничего не изменилось, коммитить нечего"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "События: список по qaravan.org, прошедшее в архиве ($(TZ=America/New_York date '+%F %H:%M'))" -- index.html qaravan-events-en.ics qaravan-events-ru.ics
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done; exit 1
