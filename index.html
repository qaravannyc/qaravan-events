<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>События QARAVAN / QARAVAN events</title>
<meta name="description" content="Ближайшие события QARAVAN в Нью-Йорке. Upcoming QARAVAN events in New York.">
<meta property="og:title" content="События QARAVAN / QARAVAN events">
<meta property="og:description" content="Все ближайшие события в одном месте. All upcoming events in one place.">
<meta name="theme-color" content="#ffffff">
<link rel="preload" href="assets/fonts/FiraSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/FiraSansCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/FiraSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/FiraSansCondensed-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/partiful-logo.png" as="image">
<link rel="preload" href="assets/margosha.svg" as="image">
<link rel="preload" href="assets/telegram-logo.svg" as="image">
<style>
  /* Дизайн-система QARAVAN (ревизия 2026-09): шрифты Fira Sans и Fira Sans Condensed,
     белая страница, квадратные формы, шесть цветов бренда только флажками и метками,
     весь текст — графитом на белом. Значения — из tokens.json дизайн-системы. */
  @font-face{font-family:"Fira Sans";src:url("assets/fonts/FiraSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Fira Sans";src:url("assets/fonts/FiraSans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Fira Sans";src:url("assets/fonts/FiraSans-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Fira Sans Condensed";src:url("assets/fonts/FiraSansCondensed-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Fira Sans Condensed";src:url("assets/fonts/FiraSansCondensed-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

  :root{
    color-scheme:light;
    --q-red:#ff3333; --q-orange:#ff9933; --q-yellow:#f8f36e; --q-green:#66cc66; --q-sky:#0099cc; --q-purple:#7668aa;
    --q-ink:#333333; --q-white:#ffffff; --q-muted:#5e5a53; --q-line:#ece8de; --q-edge:#8a857b;
    --accent:var(--q-sky);
    --font-brand:"Fira Sans","Helvetica Neue",Arial,sans-serif;
    --font-head:"Fira Sans Condensed","Arial Narrow","Fira Sans",Arial,sans-serif;
    --gutter:16px;
  }
  @media (min-width:640px){ :root{ --gutter:32px; } }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--q-white); color:var(--q-ink); font:400 16px/1.5 var(--font-brand); -webkit-font-smoothing:antialiased}
  h1,h2,h3,p{margin:0}
  button{font-family:inherit}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  ::selection{background:var(--q-yellow); color:var(--q-ink)}
  .wrap{max-width:1120px; margin:0 auto; padding:0 var(--gutter)}

  /* Флажок: квадрат цвета бренда. Жёлтый на белом — с тонкой графитовой кромкой. */
  .flag{display:inline-block; flex:none; width:.62em; height:.62em; background:var(--f,var(--q-ink))}
  .flag.y{box-shadow:inset 0 0 0 1px var(--q-ink)}
  .qv-sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  /* Шапка: логотип (ссылка на qaravan.org) и переключатель RU / EN */
  .hdr{border-bottom:1px solid var(--q-line)}
  .hdr .wrap{display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:68px}
  .home{display:inline-flex; align-items:center; min-height:44px}
  .home img{display:block; width:150px; height:auto}
  .tabs{display:inline-flex; border:2px solid var(--q-ink); background:var(--q-white)}
  .tab{min-height:40px; min-width:48px; padding:6px 14px; border:0; background:transparent; color:var(--q-ink);
    font:600 16px/1.15 var(--font-head); letter-spacing:.01em; cursor:pointer}
  .tab+.tab{box-shadow:inset 2px 0 0 var(--q-line)}
  .tab:hover{background:var(--q-line)}
  .tab[aria-selected="true"]{background:var(--q-ink); color:var(--q-white); box-shadow:none}
  .tab:focus-visible{outline-offset:-5px}
  .tab[aria-selected="true"]:focus-visible{outline-color:var(--q-yellow)}

  /* Заголовок страницы: надстрочник с флажком, заголовок, подводка */
  .intro{padding:32px 0 24px}
  .eyebrow{display:inline-flex; align-items:center; gap:10px; font:600 13.5px/1.2 var(--font-head); letter-spacing:.1em; text-transform:uppercase}
  .eyebrow .flag{font-size:17px}
  h1{margin-top:12px; font:700 34px/1.06 var(--font-head); letter-spacing:-.005em; text-wrap:balance}
  .lead{margin-top:12px; font:400 17px/1.5 var(--font-brand); color:var(--q-muted); max-width:40em}
  @media (min-width:640px){ .intro{padding:48px 0 32px} h1{font-size:46px} .lead{font-size:18px} }

  /* Фильтр по типу события: «Все» и по флажку на каждый тип */
  .filter{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px}
  .fchip{display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:6px 14px; border:2px solid var(--q-line);
    background:var(--q-white); color:var(--q-ink); font:600 15px/1.2 var(--font-brand); cursor:pointer}
  .fchip .flag{font-size:16px}
  .fchip:hover{border-color:var(--q-ink)}
  .fchip[aria-pressed="true"]{background:var(--q-ink); border-color:var(--q-ink); color:var(--q-white)}

  /* Месяц внутри списка — когда впереди события из разных месяцев */
  .month{margin:32px 0 16px; font:700 22px/1.12 var(--font-head); letter-spacing:-.005em}
  /* Сетка карточек по дизайн-системе: 3 → 2 → 1 колонки на 1000 и 640 px */
  .grid{display:grid; grid-template-columns:1fr; gap:16px}
  @media (min-width:640px){ .grid{grid-template-columns:repeat(2,1fr); gap:24px} }
  @media (min-width:1000px){ .grid{grid-template-columns:repeat(3,1fr)} }

  /* Карточка события по EventCard дизайн-системы: тип, название, строка о событии,
     когда, где, ссылка. Вся карточка нажимается: ссылка растянута на неё целиком. */
  .ev{position:relative; display:flex; flex-direction:column; background:var(--q-white); border:1px solid var(--q-line); padding:20px 20px 18px}
  @media (min-width:640px){ .ev{padding:22px 24px 20px} }
  .ev:hover{background:var(--q-line)}
  .ev.plain:hover{background:var(--q-white)}   /* старая история без ссылки: карточка не нажимается */
  .ev:focus-within{outline:3px solid var(--accent); outline-offset:2px}
  .ev .type{display:flex; align-items:center; gap:8px; font:600 14px/1.25 var(--font-brand)}
  .ev .type .flag{font-size:16px}
  .ev h3{margin-top:12px; font:700 24px/1.1 var(--font-head); letter-spacing:-.005em; text-wrap:balance}
  .ev .about{margin-top:10px; font:400 16px/1.5 var(--font-brand)}
  .ev .when{margin-top:14px; font:600 16px/1.3 var(--font-head); letter-spacing:.01em}
  .ev .place{margin-top:2px; font:400 15px/1.4 var(--font-brand); color:var(--q-muted)}
  .ev .foot{margin-top:auto; padding-top:20px}
  .link{display:inline-flex; align-items:center; gap:6px; min-height:32px; color:var(--q-ink); font:600 16px/1.2 var(--font-brand);
    text-decoration:underline; text-decoration-color:var(--q-sky); text-decoration-thickness:2px; text-underline-offset:4px}
  .link svg{width:14px; height:14px; flex:none}
  .ev .link::after{content:""; position:absolute; inset:0}
  .ev .link:focus-visible{outline:none}
  .ev:hover .link{text-decoration-color:currentColor; text-decoration-thickness:3px}
  .empty{margin-top:8px; font:400 17px/1.5 var(--font-brand); color:var(--q-muted)}

  /* Прошедшие месяцы: строки-аккордеон под графитовой линейкой */
  .past{margin-top:64px}
  .past h2{font:700 28px/1.12 var(--font-head); letter-spacing:-.005em; margin-bottom:16px}
  .acc{border-top:2px solid var(--q-ink)}
  .acc details{border-bottom:1px solid var(--q-line)}
  .acc summary{display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:56px; padding:12px 14px;
    font:600 17px/1.35 var(--font-brand); cursor:pointer; list-style:none; -webkit-tap-highlight-color:transparent}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::marker{content:""}
  .acc summary:hover{background:var(--q-line)}
  .acc summary:focus-visible{outline-offset:-3px}
  .acc details[open] summary{box-shadow:inset 6px 0 0 var(--q-sky); padding-left:22px}
  .acc summary .count{margin-left:10px; color:var(--q-muted); font-weight:400}
  .acc summary svg{width:16px; height:16px; flex:none; transition:transform .15s ease-out}
  .acc details[open] summary svg{transform:rotate(180deg)}
  .acc .grid{padding:8px 0 24px}

  /* Подвал: графитовая полоса, логотип для тёмного фона, ссылки */
  .ftr{margin-top:64px; background:var(--q-ink); color:var(--q-white)}
  .ftr .wrap{padding-top:36px; padding-bottom:22px}
  .ftr img{display:block; width:150px; height:auto}
  .ftr .tag{margin-top:16px; font:400 15px/1.5 var(--font-brand); color:rgba(255,255,255,.82); max-width:26em}
  .ftr ul{list-style:none; margin:20px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:4px 24px}
  .ftr a{display:inline-flex; align-items:center; min-height:32px; font:500 16px/1.3 var(--font-brand); color:var(--q-white); text-decoration:none}
  .ftr a:hover{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px}
  .ftr :focus-visible{outline-color:var(--q-yellow)}
  .ftr .base{margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,.22); display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 16px;
    font:400 14px/1.4 var(--font-brand); color:rgba(255,255,255,.8)}

  @media (prefers-reduced-motion:reduce){ .acc summary svg{transition:none} }

  /* Загрузка: пока не пришли шрифты, содержимое скрыто (белая страница или панель без
     прыжков текста), потом карточки поднимаются одна за другой — как в дизайн-системе. */
  html.loading:not(.embed) main{visibility:hidden}
  @media (prefers-reduced-motion:no-preference){
    html.entering .intro, html.entering .filter, html.entering .strip-head, html.entering .month{animation:q-fade .3s ease-out both}
    html.entering .ev, html.entering .strip-foot, html.entering .intro .follow, html.entering .acc, .strip.paging .ev, .strip.paging .strip-foot{animation:q-rise .42s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i, 0) * 70ms)}
  }
  @keyframes q-fade{from{opacity:0}to{opacity:1}}
  @keyframes q-rise{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

  /* Вставка на qaravan.org (Wix): events.qaravan.org/?embed=1 — белая панель с сеткой
     компактных карточек: 4 в ряд и два ряда на широком экране, 3 карточки одна под другой
     на телефоне, дальше — ссылка «Ещё N событий». Без шапки, подвала, фильтра и архива. */
  .strip{display:none}
  html.embed, html.embed body{background:transparent}
  html.embed .hdr, html.embed .ftr, html.embed .intro, html.embed #filter, html.embed #list, html.embed .past{display:none}
  html.embed main.wrap{max-width:none; padding:0}
  /* Без своей панели и заголовка: белые карточки стоят прямо на фоне секции Wix, как её
     собственные блоки; заголовок секции — на Wix. Полосы прокрутки нет никогда. */
  html.embed, html.embed body{overflow:hidden}
  html.embed .strip{display:block; background:transparent; padding:0}
  html.embed :focus-visible, html.embed .ev:focus-within{outline-offset:-3px}
  .strip .empty{background:var(--q-white); border:1px solid var(--q-line); padding:16px 20px}
  .strip-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 16px; margin-bottom:16px}
  /* Заголовок — «полоса» дизайн-системы: строка текста на своей белой подложке, квадратная,
     от левого края. Так он читается на любом участке цветного фона секции. */
  .strip-title{display:inline-flex; align-items:center; flex-wrap:wrap; gap:4px 10px; min-height:44px; padding:8px 16px; margin:0;
    background:var(--q-white); font:700 24px/1.1 var(--font-head); letter-spacing:-.005em}
  .strip-title .flag{font-size:16px}
  .strip-title .count{font:400 16px/1.2 var(--font-brand); color:var(--q-muted); letter-spacing:0}
  .strip-head .end{display:flex; align-items:center; gap:20px; margin-left:auto}
  .strip{--gap:16px}
  @media (min-width:680px){ .strip{--gap:20px} }
  .mini{display:grid; grid-template-columns:repeat(var(--cols,4),minmax(0,1fr)); gap:var(--gap)}
  /* Все карточки одного размера: высота — по самой высокой из всех событий (ближайших и прошедших) */
  .grid .ev, .mini .ev{height:var(--card-h, auto)}
  .measure{height:0; overflow:hidden; visibility:hidden; align-items:start}
  .grid.measure .ev, .mini.measure .ev{height:auto}
  .measuring *{animation:none !important}
  .strip .filter{margin:0 0 16px}
  .tab .tab-count{font-weight:400; opacity:.75; margin-left:4px}
  .mini .ev{padding:14px 16px 10px}
  .mini .ev .type{font-size:13px; gap:7px}
  .mini .ev .type .flag{font-size:13px}
  .mini .ev h3{margin-top:8px; font-size:18px; line-height:1.12}
  .mini .ev .about{margin-top:6px; font-size:15px; line-height:1.45}
  .mini .ev .when{margin-top:8px; font-size:15px}
  .mini .ev .place{font-size:15px; line-height:1.35}
  .mini .ev .foot{padding-top:8px}
  .mini .link{min-height:28px; font-size:15px}
  /* Кнопка под карточками: всегда видна — «Ещё N событий» или «Все события» */
  .pager{display:flex; flex-wrap:wrap; gap:12px}
  /* Низ вставки стоит на той же сетке, что и карточки (те же колонки и промежутки), поэтому
     края кнопок совпадают с краями карточек. Три колонки: листание строкой выше, под ним три
     кнопки — по одной под каждой колонкой. Четыре колонки: всё в один ряд, листание в первой.
     Узко: всё друг под другом во всю ширину. */
  .strip-foot{display:grid; grid-template-columns:repeat(var(--cols,1),minmax(0,1fr)); gap:12px var(--gap); margin-top:var(--gap)}
  .strip-foot > *{grid-column:1 / -1}
  .strip-foot .follow{width:auto; grid-template-columns:repeat(var(--fcols,1),minmax(0,1fr)); gap:12px var(--gap)}
  .strip-foot.one-row .pager{grid-column:1}
  .strip-foot.one-row .follow{grid-column:1 / span 3}
  .strip-foot.one-row .pager + .follow{grid-column:2 / span 3}
  .strip-foot.one-row .pager{flex-wrap:nowrap}
  .strip-foot.one-row .pager > *{flex:1 1 auto; min-height:60px; padding-inline:12px}
  .strip-foot .follow.is-cal, .strip-foot.one-row .pager + .follow.is-cal{grid-column:1 / -1}

  /* Кнопки «Подпишитесь на нас в Partiful» и «Получайте напоминания в Telegram»: одна форма,
     одна высота, квадратная плашка слева. Partiful — основная тёмная кнопка: знак «плюс»
     дизайн-системы, «Follow us on» и белый логотип Partiful. Telegram —
     белая с графитовой рамкой: слева Маргоша, справа официальный логотип Telegram
     без изменений и отдельно от Маргоши. */
  .follow{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; width:max-content; max-width:100%}
  .intro .follow{width:100%; column-gap:24px}
  html.embed .cta-sub{display:none}
  @media (max-width:759px){ .follow{grid-template-columns:1fr; width:100%} }
  button.cta{font:inherit; text-align:left}
  .cta-cal{background:var(--q-white); color:var(--q-ink)}
  .cta-cal:hover{background:var(--q-line)}
  .cta-cal .cta-sub{color:var(--q-muted)}
  .cta-mark.ink{background:var(--q-ink); color:var(--q-white)}

  /* Панель «Подписаться на календарь»: язык календаря, Google / Apple / Outlook,
     ссылка для всего остального. Названия сервисов — только текстом (без логотипов). */
  .follow.is-cal{display:block; width:100%}
  .cal{background:var(--q-white); border:2px solid var(--q-ink); padding:14px 18px 12px}
  .cal-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
  .cal-title{display:inline-flex; align-items:center; gap:10px; margin:0 auto 0 0; font:700 22px/1.1 var(--font-head); letter-spacing:-.005em}
  .cal-title svg{width:18px; height:18px}
  .cal-lang{display:inline-flex; align-items:center; gap:10px}
  .cal-lang-label{font:400 15px/1.2 var(--font-brand); color:var(--q-muted)}
  .cal-close{display:grid; place-items:center; width:44px; height:44px; padding:0; border:2px solid var(--q-ink); background:var(--q-white); color:var(--q-ink); cursor:pointer}
  .cal-close:hover{background:var(--q-line)}
  .cal-close svg{width:16px; height:16px}
  .cal-lead{margin-top:10px; font:600 16px/1.3 var(--font-brand)}
  .cal-options{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px}
  .cal-opt{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:8px 16px; background:var(--q-ink); color:var(--q-white);
    font:600 17px/1.15 var(--font-head); letter-spacing:.01em; text-decoration:none}
  .cal-opt:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14)}
  .cal-opt svg{width:14px; height:14px; flex:none}
  .cal-copy{display:flex; gap:8px; margin-top:10px}
  .cal-url{flex:1; min-width:0; min-height:44px; padding:8px 12px; border:2px solid var(--q-edge); background:var(--q-white); color:var(--q-ink); font:400 15px/1.2 var(--font-brand)}
  .cal-url:focus{border-color:var(--q-ink)}
  .cal-copy-btn{min-height:44px; padding:8px 16px; border:2px solid var(--q-ink); background:var(--q-white); color:var(--q-ink); font:600 17px/1.15 var(--font-head); cursor:pointer; white-space:nowrap}
  .cal-copy-btn:hover{background:var(--q-line)}
  .cal-note{margin-top:8px; font:400 15px/1.4 var(--font-brand); color:var(--q-muted)}
  .cal-tm{margin-top:4px; font:400 12px/1.4 var(--font-brand); color:var(--q-muted)}
  @media (max-width:479px){ .cal-options > *{flex:1 1 100%} .cal-copy{flex-wrap:wrap} .cal-copy-btn{flex:1 1 100%} .cal-lang{width:100%} }
  .cta{display:flex; align-items:center; gap:12px; min-height:60px; padding:8px 16px 8px 8px; border:2px solid var(--q-ink);
    text-decoration:none; cursor:pointer}
  .cta-partiful{background:var(--q-ink); color:var(--q-white)}
  .cta-partiful:hover{box-shadow:inset 0 0 0 999px rgba(0,0,0,.14)}
  .cta-telegram{background:var(--q-white); color:var(--q-ink)}
  .cta-telegram:hover{background:var(--q-line)}
  .cta:active{transform:translateY(1px)}
  .cta-mark{flex:none; display:grid; place-items:center; width:40px; height:40px; background:var(--q-white); color:var(--q-ink)}
  .cta-mark svg{width:16px; height:16px}
  .cta-avatar{flex:none; display:block; width:40px; height:40px}
  .cta-text{display:flex; flex-direction:column; min-width:0}
  .cta-label{font:600 17px/1.15 var(--font-head); letter-spacing:.01em}
  .cta-sub{margin-top:2px; font:400 15px/1.25 var(--font-brand)}
  .cta-partiful .cta-sub{color:rgba(255,255,255,.82)}
  /* «Follow us on» + логотип Partiful (белый, файл с сайта Partiful без изменений, только уменьшен):
     низ слова partiful стоит на одной линии с текстом */
  .cta-pf-label{display:flex; flex-wrap:wrap; align-items:center; gap:2px 7px}
  .cta-pf{display:block; flex:none; width:auto; height:24px; position:relative; top:1px}
  .cta-telegram .cta-sub{color:var(--q-muted)}
  .cta-go{flex:none; margin-left:auto; padding-left:4px; display:flex}

  let head;
  if (PAGE) {                                                   // страница «События»: заголовок у самой страницы Wix
    const views = [["upcoming", t.upcomingTab, upcoming.length], ["past", t.pastTab, PAST.length]].filter(v => v[0] === "upcoming" || v[2]);
    const present = Object.keys(TYPES).filter(k => stripSource().some(e => typeOf(e) === k));
    head = `<div class="strip-head">
        <div class="tabs" role="tablist" aria-label="${t.viewLabel}">${views.map(([v, label, c]) =>
          `<button class="tab" type="button" role="tab" data-view="${v}" aria-selected="${strip.view === v}" tabindex="${strip.view === v ? 0 : -1}">${label}<span class="tab-count">${c}</span></button>`).join("")}</div>
        <div class="end">${langTabs()}</div>
      </div>` + (present.length > 1 ? `<div class="filter" role="group" aria-label="${t.filter}">` +
        `<button type="button" class="fchip" data-type="all" aria-pressed="${strip.type === "all"}">${t.all}</button>` +
        present.map(k => `<button type="button" class="fchip" data-type="${k}" aria-pressed="${strip.type === k}"><span class="flag${TYPES[k].yellow ? " y" : ""}" style="--f:${TYPES[k].color}"></span><span lang="en">${TYPES[k].label}</span></button>`).join("") +
        `</div>` : "");
  } else {                                                      // главная: свой заголовок на белой «полосе»
    head = `<div class="strip-head">
        <h2 id="strip-title" class="strip-title"><span class="flag" style="--f:var(--q-sky)"></span>${t.upcoming}${n ? `<span class="count">${t.count(n)}</span>` : ""}</h2>
        <div class="end">${langTabs()}</div>
      </div>`;
  }
  const pager = start > 0 || rest
    ? `<div class="pager">` +
        (start > 0 ? `<button type="button" class="back" data-go="back">${ARROW_BACK}${t.back}</button>` : "") +
        (rest ? `<button type="button" class="more" data-go="next">${t.more(rest)}${ARROW}</button>` : "") + `</div>`
    : "";
  const foot = `<div class="strip-foot${cols >= 4 ? " one-row" : ""}" style="--i:${Math.min(fit, 8)}; --cols:${cols}; --fcols:${cols >= 3 ? 3 : 1}">${pager}${followHTML()}</div>`;
  return `<p class="qv-sr" aria-live="polite">${n ? t.showing(start + 1, start + Math.min(fit, n - start), n) : ""}</p>` + head +
    (n ? `<div class="mini" style="--cols:${cols}">${items.slice(start, start + fit).map(e => card(e, lang, past)).join("")}</div>`
       : `<p class="empty">${t.empty}</p>`) + foot;
}

// Высота самой высокой карточки среди всех событий (ближайших и прошедших) при этой ширине:
// её получают все карточки, поэтому размер не меняется ни от страницы, ни от вкладки, ни от фильтра.
// Архив большой, поэтому мерим один раз на язык и ширину; догрузившийся шрифт сбрасывает запомненное.
const tallCache = new Map();
if (document.fonts) document.fonts.addEventListener("loadingdone", () => tallCache.clear());
function tallestCard(host, cls, style) {
  const key = [lang, cls, style || "", host.clientWidth].join("|");
  if (tallCache.has(key)) return tallCache.get(key);
  const m = document.createElement("div");
  m.className = cls + " measure"; if (style) m.setAttribute("style", style);
  m.innerHTML = [...upcoming.map(e => card(e, lang)), ...PAST.map(e => card(e, lang, true))].join("");
  host.appendChild(m);
  let h = 0; m.querySelectorAll(".ev").forEach(e => { h = Math.max(h, e.getBoundingClientRect().height); });
  m.remove(); cardIndex = 0;
  if (h) tallCache.set(key, Math.ceil(h));
  return Math.ceil(h);
}

function renderStrip(anim) {
  const el = document.getElementById("strip"), cols = stripCols(), items = stripList();
  document.documentElement.lang = lang;
  if (strip.start >= items.length) { strip.start = 0; strip.history = []; }
  const start = strip.start;
  el.classList.add("measuring");                                // меряем без анимации: иначе карточки «ниже» на 10 px
  // 1) одна высота на все карточки
  el.innerHTML = "";
  const cardH = tallestCard(el, "mini", `--cols:${cols}`);
  el.style.setProperty("--card-h", cardH + "px");
  // 2) столько целых рядов, сколько помещается в высоту вставки
  const fits = () => innerHeight < 120 || el.lastElementChild.getBoundingClientRect().bottom <= innerHeight + 0.5;
  let fit = items.length - start;
  // Больше рядов, чем высота вставки / высота карточки, не влезет никогда: начинаем с этого числа,
  // а не со всего архива (иначе сотни перерисовок на каждое нажатие «Ещё»).
  if (innerHeight >= 120 && cardH > 0) fit = Math.min(fit, (Math.ceil(innerHeight / cardH) + 1) * cols);
  cardIndex = 0; el.innerHTML = stripHTML(items, start, fit, cols);
  while (fit > 1 && !fits()) {
    const rows = Math.ceil(fit / cols) - 1;
    fit = cols === 1 || rows < 1 ? fit - 1 : rows * cols;
    cardIndex = 0; el.innerHTML = stripHTML(items, start, fit, cols);
  }
  strip.shown = fit;
  el.classList.remove("measuring");
  if (anim) {                                                   // новая страница или вкладка: карточки поднимаются заново
    el.classList.remove("paging"); void el.offsetWidth; el.classList.add("paging");
    clearTimeout(renderStrip.t); renderStrip.t = setTimeout(() => el.classList.remove("paging"), 1000);
    const first = el.querySelector(".mini .ev .link");
    if (first && anim === "keyboard") first.focus({ preventScroll: true });
  }
}
if (EMBED) {
  const busy = () => document.documentElement.classList.contains("loading");
  let queued = false;
  addEventListener("resize", () => { if (busy() || queued) return; queued = true; requestAnimationFrame(() => { queued = false; renderStrip(); }); });
  // шрифт, догрузившийся позже первого показа (медленная сеть), снова подгоняет ряды
  if (document.fonts) document.fonts.addEventListener("loadingdone", () => {
    if (busy()) return;
    if (document.documentElement.classList.contains("entering")) setTimeout(() => renderStrip(), 1500); else renderStrip();
  });
}

// Кнопки под заголовком на events.qaravan.org (во вставках они внизу, в renderStrip)
function renderFollow() {
  if (EMBED) return renderStrip();
  document.getElementById("follow").outerHTML = followHTML().replace('<div class="follow', '<div id="follow" class="follow');
}
async function copyFeed(btn) {
  const input = btn.parentElement.querySelector(".cal-url"), t = T[lang];
  let ok = false;
  try { await navigator.clipboard.writeText(input.value); ok = true; } catch (_) {}
  if (!ok) { input.focus(); input.select(); try { ok = document.execCommand("copy"); } catch (_) {} }
  btn.textContent = ok ? t.calCopied : t.calCopyFail;
  if (!ok) { input.focus(); input.select(); }
}

// Главная страница events.qaravan.org: все карточки одного размера — по самой высокой из всех
function equalizeAll() {
  const main = document.querySelector("main");
  main.style.setProperty("--card-h", tallestCard(document.getElementById("list"), "grid") + "px");
}

function render() {
  if (EMBED) return renderStrip();
  cardIndex = 0;
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.doc;
  document.querySelectorAll(".tab").forEach(b => {
    const on = b.dataset.lang === lang;
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
  });

  const monthName = ym => { const [y, m] = ym.split("-").map(Number); return { name: t.months[m - 1], y }; };
  let range = "";
  if (months.length) {
    const a = monthName(months[0]), b = monthName(months[months.length - 1]);
    range = months.length === 1 ? `${a.name} ${a.y}` : a.y === b.y ? `${a.name} – ${b.name} ${a.y}` : `${a.name} ${a.y} – ${b.name} ${b.y}`;
  }
  document.getElementById("eyebrow").innerHTML = `<span class="flag" style="--f:var(--q-sky)"></span>${esc(range || t.eyebrow)}`;
  document.getElementById("title").textContent = t.upcoming;
  document.getElementById("lead").textContent = t.lead;
  renderFollow();

  // Фильтр: «Все» и только те типы, что есть среди ближайших событий
  const present = Object.keys(TYPES).filter(k => upcoming.some(e => typeOf(e) === k));
  if (!present.includes(filter)) filter = "all";
  const fl = document.getElementById("filter");
  fl.setAttribute("aria-label", t.filter);
  fl.hidden = present.length < 2;
  fl.innerHTML = `<button type="button" class="fchip" data-type="all" aria-pressed="${filter === "all"}">${t.all}</button>` +
    present.map(k => `<button type="button" class="fchip" data-type="${k}" aria-pressed="${filter === k}"><span class="flag${TYPES[k].yellow ? " y" : ""}" style="--f:${TYPES[k].color}"></span><span lang="en">${TYPES[k].label}</span></button>`).join("");

  const shown = upcoming.filter(e => filter === "all" || typeOf(e) === filter);
  const shownMonths = months.filter(ym => shown.some(e => monthOf(firstDate(e)) === ym));
  document.getElementById("list").innerHTML = !shown.length
    ? `<p class="empty">${t.empty}</p>`
    : shownMonths.map(ym => {
        const part = shown.filter(e => monthOf(firstDate(e)) === ym);
        const head = months.length > 1 ? `<h2 class="month">${monthName(ym).name}</h2>` : "";
        return head + `<div class="grid">${part.map(e => card(e, lang)).join("")}</div>`;
      }).join("");

  const open = new Set([...document.querySelectorAll("#archive details[open]")].map(d => d.dataset.month));
  document.getElementById("past").hidden = !archive.length;
  document.getElementById("past-title").textContent = t.past;
  document.getElementById("archive").innerHTML = archive.map(m => {
    const l = monthName(m.month), events = perDate(m.events).sort(byDate);
    return `<details data-month="${m.month}"${open.has(m.month) ? " open" : ""}>
      <summary><span>${l.name} ${l.y} <span class="count">${t.count(events.length)}</span></span>${CHEVRON}</summary>
      <div class="grid">${events.map(e => card(e, lang, true)).join("")}</div>
    </details>`;
  }).join("");

  document.getElementById("tagline").textContent = t.tagline;
  document.getElementById("donate").textContent = t.donate;
  equalizeAll();
}

function setLang(next) {
  if (next === lang) return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
  if (!EMBED) {
    const u = new URL(location.href); u.searchParams.set("lang", lang);
    try { history.replaceState(null, "", u); } catch (_) {}
  }
  render();
}

document.addEventListener("click", ev => {
  const c = ev.target.closest("[data-cal], [data-cal-lang]");
  if (c) {
    if (c.dataset.calLang) { cal.lang = c.dataset.calLang; renderFollow(); const tab = document.querySelector(`[data-cal-lang="${cal.lang}"]`); if (tab) tab.focus(); return; }
    if (c.dataset.cal === "copy") return copyFeed(c);
    cal.open = c.dataset.cal === "open"; cal.lang = cal.open ? lang : null;
    renderFollow();
    const next = document.querySelector(cal.open ? ".cal .cal-opt" : '[data-cal="open"]');
    if (next) next.focus({ preventScroll: true });
    return;
  }
  const l = ev.target.closest("[data-lang]");
  if (l) return setLang(l.dataset.lang);
  const inStrip = EMBED && ev.target.closest("#strip");
  const chip = ev.target.closest(".fchip[data-type]");
  if (chip && !inStrip) { filter = chip.dataset.type; return render(); }
  if (!inStrip) return;
  const how = ev.detail === 0 ? "keyboard" : "pointer";        // клавиатура: фокус на первую новую карточку
  const v = ev.target.closest("[data-view]");
  if (v) { if (strip.view !== v.dataset.view) { strip.view = v.dataset.view; strip.type = "all"; strip.start = 0; strip.history = []; renderStrip("switch"); } return; }
  if (chip) { strip.type = chip.dataset.type; strip.start = 0; strip.history = []; return renderStrip("switch"); }
  const go = ev.target.closest("[data-go]");
  if (go) {
    if (go.dataset.go === "next") { strip.history.push(strip.start); strip.start += strip.shown; }
    else strip.start = strip.history.length ? strip.history.pop() : 0;
    renderStrip(how);
  }
});
// стрелки влево / вправо (и Home / End) внутри любого набора вкладок
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && cal.open && ev.target.closest(".cal")) {
    cal.open = false; cal.lang = null; renderFollow();
    const b = document.querySelector('[data-cal="open"]'); if (b) b.focus({ preventScroll: true });
    return;
  }
  const tab = ev.target.closest('[role="tab"]');
  if (!tab) return;
  const tabs = [...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')], i = tabs.indexOf(tab), n = tabs.length;
  const j = ev.key === "ArrowRight" ? (i + 1) % n : ev.key === "ArrowLeft" ? (i - 1 + n) % n : ev.key === "Home" ? 0 : ev.key === "End" ? n - 1 : -1;
  if (j < 0) return;
  ev.preventDefault();
  const d = tabs[j].dataset, key = d.lang ? `[data-lang="${d.lang}"]` : d.view ? `[data-view="${d.view}"]` : `[data-cal-lang="${d.calLang}"]`;
  tabs[j].click();
  const again = (EMBED ? document.getElementById("strip") : document).querySelector(`[role="tab"]${key}`);
  if (again) again.focus();
});
if (!EMBED) {
  let queued = false;
  addEventListener("resize", () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; equalizeAll(); }); });
}

// Первый показ: ждём шрифты (не дольше 2,5 с), раскладываем один раз и плавно проявляем.
const FACES = ['400 16px "Fira Sans"', '600 16px "Fira Sans"', '600 16px "Fira Sans Condensed"', '700 24px "Fira Sans Condensed"'];
const fontsIn = document.fonts && document.fonts.load
  ? Promise.race([Promise.all(FACES.map(f => document.fonts.load(f, "Aa Яя"))), new Promise(r => setTimeout(r, 2500))]).catch(() => {})
  : Promise.resolve();
fontsIn.then(() => {
  cardIndex = 0; render();
  count(PAGE ? "/embed/events" : EMBED ? "/embed/home" : "/", PAGE ? "qaravan.org/events (embed)" : EMBED ? "qaravan.org home page (embed)" : "events.qaravan.org", false);
  const c = document.documentElement.classList;
  c.add("entering"); c.remove("loading");
  setTimeout(() => c.remove("entering"), 1400);   // дальше (фильтр, язык) — без анимации
});
</script>
</body>
</html>
