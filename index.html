<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>События QARAVAN</title>
<meta name="description" content="Ближайшие события QARAVAN. Жмите на событие — внутри детали и регистрация.">
<meta property="og:title" content="События QARAVAN">
<meta property="og:description" content="Все ближайшие события в одном месте. Жмите и регистрируйтесь 🧡">
<meta name="theme-color" content="#FAF4E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF4E8; --ink:#1c1c1c; --muted:#6b6558; --card:#ffffff;
    --orange:#E8890C; --purple:#7B4FD8; --blue:#2196D9; --green:#2E9E44; --red:#E23838;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Montserrat',-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px 16px 48px;
  }
  .wrap{max-width:480px; margin:0 auto;}
  header{text-align:center; margin-bottom:22px;}
  .logo{
    display:inline-block; background:#333333; border-radius:14px;
    padding:8px 18px 10px; font-weight:800; font-size:26px; letter-spacing:.5px;
  }
  /* Фирменные цвета логотипа QARAVAN (сняты с оригинала на qaravan.org) */
  .logo span:nth-child(1){color:#FFFFFF}
  .logo span:nth-child(2){color:#FF3333}
  .logo span:nth-child(3){color:#FF9933}
  .logo span:nth-child(4){color:#F8F36E}
  .logo span:nth-child(5){color:#66CC66}
  .logo span:nth-child(6){color:#0099CC}
  .logo span:nth-child(7){color:#7668AA}
  .badge{
    display:inline-block; margin-top:14px; background:var(--red); color:#fff;
    font-weight:800; font-size:12px; letter-spacing:1.5px; border-radius:999px;
    padding:6px 14px;
  }
  h1{font-size:26px; font-weight:800; margin-top:10px; letter-spacing:-.3px;}
  .sub{margin-top:6px; color:var(--muted); font-size:14px; font-weight:600;}
  .note{margin-top:12px; color:var(--muted); font-size:13px; font-weight:600; line-height:1.4;}
  .card{
    display:flex; gap:14px; align-items:center;
    background:var(--card); border-radius:18px; padding:14px 16px;
    margin-top:12px; text-decoration:none; color:inherit;
    box-shadow:0 1px 2px rgba(30,25,10,.06), 0 6px 18px rgba(30,25,10,.06);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{transform:scale(.985);}
  @media (hover:hover){ .card:hover{transform:translateY(-2px); box-shadow:0 2px 4px rgba(30,25,10,.07), 0 10px 24px rgba(30,25,10,.09);} }
  .date{flex:0 0 58px; text-align:center; font-weight:800;}
  .date .num{font-size:26px; line-height:1; display:block;}
  .date .num.small{font-size:15px; line-height:1.25;}
  .date .dow{font-size:10px; letter-spacing:1.2px; color:var(--muted); font-weight:700; display:block; margin-top:3px;}
  .info{min-width:0; flex:1;}
  .info .title{display:block; font-weight:800; font-size:15.5px; line-height:1.25;}
  .info .ru{display:block; color:var(--muted); font-size:13px; font-weight:600; margin-top:3px; line-height:1.35;}
  .info .meta{display:block; font-size:12px; font-weight:700; margin-top:5px; color:var(--ink); opacity:.75;}
  .arrow{margin-left:auto; flex:0 0 auto; color:var(--muted); font-weight:800;}
  /* Подпись месяца внутри списка — когда впереди события из разных месяцев */
  .month{margin:24px 0 -2px 4px; font-size:11px; letter-spacing:1.5px; font-weight:800; color:var(--muted); text-transform:uppercase;}
  .empty{margin-top:16px; text-align:center; color:var(--muted); font-size:14px; font-weight:600;}

  /* Прошлые месяцы — свёрнутый блок под текущим списком */
  .archive{margin-top:28px;}
  .archive summary{
    display:flex; align-items:center; gap:14px; cursor:pointer; list-style:none;
    background:rgba(28,28,28,.055); border-radius:18px; padding:14px 16px;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .archive summary::-webkit-details-marker{display:none;}
  .archive summary::marker{content:"";}
  .archive summary:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .archive .arch-label{display:block; font-size:10px; letter-spacing:1.5px; font-weight:800; color:var(--muted);}
  .archive .arch-title{display:block; font-size:15.5px; font-weight:800; margin-top:3px; line-height:1.25;}
  .archive .arch-title .arch-count{color:var(--muted); font-weight:700; white-space:nowrap;}
  .archive .arch-hint{margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:700;}
  .archive .arch-hint .hide{display:none;}
  .archive[open] .arch-hint .show{display:none;}
  .archive[open] .arch-hint .hide{display:inline;}
  .archive .chev{display:inline-block; font-size:16px; font-weight:800; transform:rotate(90deg); transition:transform .2s ease;}
  .archive[open] .chev{transform:rotate(-90deg);}
  .archive .past{padding-bottom:4px;}

  footer{text-align:center; margin-top:26px; color:var(--muted); font-size:13px; font-weight:600;}
  footer a{color:var(--ink); font-weight:800; text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span>q</span><span>a</span><span>r</span><span>a</span><span>v</span><span>a</span><span>n</span></div><br>
    <span class="badge" id="badge"></span>
    <h1 id="title"></h1>
    <p class="sub">Жмите на событие — внутри детали и регистрация 🧡</p>
    <p class="note">Our events are open to anyone, regardless of the language you speak!</p>
  </header>
  <div id="list"></div>
  <div id="archive"></div>
  <footer>
    <a href="https://qaravan.org">qaravan.org</a> 
  </footer>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  КАК ОБНОВИТЬ ЭТУ СТРАНИЦУ (инструкция для команды QARAVAN)
//
//  1. Откройте файл index.html в репозитории на GitHub
//     и нажмите карандаш («Edit this file») справа сверху.
//  2. Меняйте ТОЛЬКО текст в кавычках в списке EVENTS ниже.
//     Одно событие = один блок в фигурных скобках { ... }.
//     • Добавить — скопируйте любой блок и поправьте текст.
//     • Отменили — сотрите его блок целиком (вместе с запятой).
//     • dates — дата события в виде "ГГГГ-ММ-ДД". Число, день недели,
//       месяц в шапке и порядок карточек страница считает сама.
//       Несколько дат в одной карточке (как у группы поддержки) —
//       через запятую: dates: ["2026-10-01", "2026-10-08", "2026-10-15"].
//  3. Прошедшие события переносить никуда не нужно: каждую ночь робот
//     (Actions → «archive past events», файл robot/archive-past.mjs)
//     сам убирает их из EVENTS в ARCHIVE — свёрнутый список прошлых
//     месяцев под текущим. ARCHIVE руками не трогайте.
//  4. Нажмите зелёную кнопку «Commit changes» (дважды).
//     Сайт events.qaravan.org обновится сам через 1–2 минуты.
// ══════════════════════════════════════════════════════════════

const EVENTS = [
  {
    dates: ["2026-09-20"],
    title: "Bike Ride & Picnic in Prospect Park",
    ru: "Два часа на велосипедах, в 2 PM — пикник",
    meta: "12:00 PM · Grand Army Plaza",
    link: "https://partiful.com/e/sAIAUZPujCWJo5WEjVbT"
  },
  {
    dates: ["2026-09-21"],
    title: "Midtown: Walking Tour",
    ru: "Особняки, ар-деко и истории, которых нет в путеводителях",
    meta: "7:00 PM · Мидтаун",
    link: "https://partiful.com/e/JieZXWSi8UUxnHw318yv"
  },
  {
    dates: ["2026-09-24", "2026-09-30"],
    title: "Support Group with Gina",
    ru: "Группа поддержки, вход по анкете",
    meta: "7:30 PM · Zoom",
    link: "https://form.typeform.com/to/dbH75jNe"
  },
  {
    dates: ["2026-09-26"],
    title: "Community Help Desk with Ezra & Olga",
    ru: "Документы, работа, жильё, врачи — подскажем, к кому идти",
    meta: "11:30 AM · Brooklyn Public Library",
    link: "https://partiful.com/e/LZQzvHq6SIkfflKwNx8c"
  },
  {
    dates: ["2026-10-03"],
    title: "Girls' Gathering with Alyona",
    ru: "Девичник: знакомимся за кофе, говорим о важном",
    meta: "11:00 AM · The Center, 208 W 13th St",
    link: "https://partiful.com/e/rftXnCTfbVgRIcKBJooa"
  }
];

// Прошлые месяцы: свёрнуты под текущим списком. Заполняет робот — руками не трогать.
const ARCHIVE = [
  {
    month: "2026-09",
    events: [
      {
        dates: ["2026-09-03", "2026-09-10", "2026-09-16"],
        title: "Support Group with Gina",
        ru: "Группа поддержки, вход по анкете",
        meta: "7:30 PM · Zoom",
        link: "https://form.typeform.com/to/dbH75jNe"
      },
      {
        dates: ["2026-09-06"],
        title: "Art Class with Lilu",
        ru: "Акварель с натуры: рисуем фонтан Bethesda",
        meta: "11:30 AM · Central Park",
        link: "https://partiful.com/e/N43yk4Hu89fHcEC1c3bZ"
      },
      {
        dates: ["2026-09-12"],
        title: "Support Group with Simon",
        ru: "Группа равной поддержки, вход по анкете",
        meta: "11:00 AM · онлайн",
        link: "https://forms.monday.com/forms/7bcb691e5cfa7a1a27851836a73928bd"
      },
      {
        dates: ["2026-09-19"],
        title: "Qaravan Climbs Bull Hill",
        ru: "Хайк над Гудзоном, 8,5 км, в конце — мороженое",
        meta: "сбор 8:30 AM · Grand Central",
        link: "https://partiful.com/e/6N0lOXvwZvJlFa3G6MGl"
      },
      {
        dates: ["2026-09-19"],
        title: "Movie Night: Paris Is Burning",
        ru: "Кинопоказ: балы и вогинг в Нью-Йорке восьмидесятых",
        meta: "6:00 PM · адрес — после регистрации",
        link: "https://partiful.com/e/Hx4woufRJ9eeHHznGkwc"
      }
    ]
  },
  {
    month: "2026-08",
    events: [
      {
        dates: ["2026-08-01"],
        title: "Pasta-Making Master Class",
        ru: "Готовим орекьетте с нуля, мест всего 15",
        meta: "5:00 PM · Бушвик",
        link: "https://partiful.com/e/wCQQnxGDkWSxgsp5FbxR"
      },
      {
        dates: ["2026-08-02"],
        title: "9/11 Memorial Museum Visit",
        ru: "Идём вместе, вход бесплатный для нью-йоркцев",
        meta: "4:00 PM · билет — заранее",
        link: "https://partiful.com/e/i6yI4MnhRHYBkAEDmKAQ"
      },
      {
        dates: ["2026-08-03"],
        title: "LGBTQ+ History Walking Tour",
        ru: "Квир-история Нью-Йорка: Stonewall, Julius' и не только",
        meta: "7:00 PM · Greenwich Village",
        link: "https://partiful.com/e/bzdBwjr08VtbX5mWsufI"
      },
      {
        dates: ["2026-08-06", "2026-08-12", "2026-08-20", "2026-08-26"],
        title: "Support Group with Gina",
        ru: "Группа поддержки, вход по анкете",
        meta: "7:30 PM · Zoom",
        link: "https://form.typeform.com/to/dbH75jNe"
      },
      {
        dates: ["2026-08-09"],
        title: "United in Anger: A History of ACT UP",
        ru: "Кинопоказ о движении ACT UP, мест 15",
        meta: "6:00 PM · Бруклин",
        link: "https://partiful.com/e/NGsRoEiKHozec7FFJYfF"
      },
      {
        dates: ["2026-08-13"],
        title: "Beach Day: Rockaway",
        ru: "Пляжный день на The People's Beach",
        meta: "2:00 PM · Jacob Riis Park",
        link: "https://partiful.com/e/4bEHkQT0nAkQIIAcCT3U"
      },
      {
        dates: ["2026-08-15"],
        title: "Bear Mountain Hike & Swim",
        ru: "Хайк, обед на вершине и бассейн",
        meta: "сбор 8:10 AM · Port Authority",
        link: "https://partiful.com/e/9gIemtCpwA8zR7aCj1Yr"
      },
      {
        dates: ["2026-08-29"],
        title: "Asylum Interview Experience: Q&A",
        ru: "Что спрашивают в USCIS? Отвечают те, кто прошёл сам",
        meta: "5:00 PM · место скоро",
        link: "https://partiful.com/e/U2h85QFEd02MWl2phG5Y"
      }
    ]
  }
];

// ── Дальше ничего менять не нужно ─────────────────────────────
const COLORS = ["#E8890C", "#7B4FD8", "#2196D9", "#2E9E44", "#E23838"];
const MONTHS_EN = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
const MONTHS_RU = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const MONTHS_RU_NOM = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
const DOW_RU = ["ВС", "ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ"];

const sortedDates = e => [...e.dates].sort();
const firstDate = e => sortedDates(e)[0];
const monthOf = iso => iso.slice(0, 7);                       // "2026-10-03" → "2026-10"
const byDate = (a, b) => firstDate(a).localeCompare(firstDate(b));

function monthLabel(ym) {                                     // "2026-10" → { en: "OCTOBER", ru: "октября", nom: "Октябрь", year: 2026 }
  const [y, m] = ym.split("-").map(Number);
  return { en: MONTHS_EN[m - 1], ru: MONTHS_RU[m - 1], nom: MONTHS_RU_NOM[m - 1], year: y };
}

function badgeFor(months) {                                   // ["2026-09", "2026-10"] → "SEPTEMBER – OCTOBER 2026"
  const a = monthLabel(months[0]), b = monthLabel(months[months.length - 1]);
  if (months.length === 1) return `${a.en} ${a.year}`;
  return a.year === b.year ? `${a.en} – ${b.en} ${a.year}` : `${a.en} ${a.year} – ${b.en} ${b.year}`;
}

// Колонка с датой: числа (по два в строке) и дни недели — считаются из dates.
function dateColumn(e) {
  const ds = sortedDates(e).map(iso => {
    const [y, m, d] = iso.split("-").map(Number);
    return { d, dow: DOW_RU[new Date(Date.UTC(y, m - 1, d)).getUTCDay()] };
  });
  const lines = [];
  for (let i = 0; i < ds.length; i += 2) lines.push(ds.slice(i, i + 2).map(x => x.d).join(" · "));
  return { num: lines.join("<br>"), small: ds.length > 1, dow: [...new Set(ds.map(x => x.dow))].join(" / ") };
}

function renderCards(events, offset = 0) {
  return events.map((e, i) => {
    const color = COLORS[(offset + i) % COLORS.length];
    const d = dateColumn(e);
    return `<a class="card" href="${e.link}">
    <span class="date"><span class="num${d.small ? " small" : ""}" style="color:${color}">${d.num}</span><span class="dow">${d.dow}</span></span>
    <span class="info">
      <span class="title">${e.title}</span>
      <span class="ru">${e.ru}</span>
      <span class="meta">${e.meta}</span>
    </span>
    <span class="arrow">›</span>
  </a>`;
  }).join("");
}

function plural(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return n + " событие";
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return n + " события";
  return n + " событий";
}

const upcoming = [...EVENTS].sort(byDate);
const months = [...new Set(upcoming.map(e => monthOf(firstDate(e))))];
const badge = months.length ? badgeFor(months) : "";
document.getElementById("badge").textContent = badge;
document.getElementById("badge").style.display = badge ? "" : "none";
document.getElementById("title").textContent = months.length === 1 ? "События " + monthLabel(months[0]).ru : "Ближайшие события";
document.title = "События QARAVAN" + (badge ? " — " + badge.toLowerCase() : "");

// Если впереди события из разных месяцев, между ними — подпись с месяцем.
let shown = 0;
document.getElementById("list").innerHTML = !upcoming.length
  ? `<p class="empty">Новые события скоро появятся 🧡</p>`
  : months.map(ym => {
      const part = upcoming.filter(e => monthOf(firstDate(e)) === ym);
      const html = (months.length > 1 ? `<div class="month">${monthLabel(ym).nom}</div>` : "") + renderCards(part, shown);
      shown += part.length;
      return html;
    }).join("");

document.getElementById("archive").innerHTML = [...ARCHIVE].sort((a, b) => b.month.localeCompare(a.month)).map(m => {
  const l = monthLabel(m.month), events = [...m.events].sort(byDate);
  return `<details class="archive">
    <summary>
      <span class="arch-info">
        <span class="arch-label">${l.en} ${l.year}</span>
        <span class="arch-title">События ${l.ru} <span class="arch-count">· ${plural(events.length)}</span></span>
      </span>
      <span class="arch-hint"><span class="show">Показать</span><span class="hide">Скрыть</span> <span class="chev">›</span></span>
    </summary>
    <div class="past">${renderCards(events)}</div>
  </details>`;
}).join("");
</script>
</body>
</html>
