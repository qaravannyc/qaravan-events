<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>События QARAVAN — сентябрь 2026</title>
<meta name="description" content="Все события QARAVAN в этом месяце. Жмите на событие — внутри детали и регистрация.">
<meta property="og:title" content="События QARAVAN">
<meta property="og:description" content="Все события месяца в одном месте. Жмите и регистрируйтесь 🧡">
<meta name="theme-color" content="#FAF4E8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF4E8; --ink:#1c1c1c; --muted:#6b6558; --card:#ffffff;
    --orange:#E8890C; --purple:#7B4FD8; --blue:#2196D9; --green:#2E9E44; --red:#E23838;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Montserrat',-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px 16px 48px;
  }
  .wrap{max-width:480px; margin:0 auto;}
  header{text-align:center; margin-bottom:22px;}
  .logo{
    display:inline-block; background:#333333; border-radius:14px;
    padding:8px 18px 10px; font-weight:800; font-size:26px; letter-spacing:.5px;
  }
  /* Фирменные цвета логотипа QARAVAN (сняты с оригинала на qaravan.org) */
  .logo span:nth-child(1){color:#FFFFFF}
  .logo span:nth-child(2){color:#FF3333}
  .logo span:nth-child(3){color:#FF9933}
  .logo span:nth-child(4){color:#F8F36E}
  .logo span:nth-child(5){color:#66CC66}
  .logo span:nth-child(6){color:#0099CC}
  .logo span:nth-child(7){color:#7668AA}
  .badge{
    display:inline-block; margin-top:14px; background:var(--red); color:#fff;
    font-weight:800; font-size:12px; letter-spacing:1.5px; border-radius:999px;
    padding:6px 14px;
  }
  h1{font-size:26px; font-weight:800; margin-top:10px; letter-spacing:-.3px;}
  .sub{margin-top:6px; color:var(--muted); font-size:14px; font-weight:600;}
  .card{
    display:flex; gap:14px; align-items:center;
    background:var(--card); border-radius:18px; padding:14px 16px;
    margin-top:12px; text-decoration:none; color:inherit;
    box-shadow:0 1px 2px rgba(30,25,10,.06), 0 6px 18px rgba(30,25,10,.06);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{transform:scale(.985);}
  @media (hover:hover){ .card:hover{transform:translateY(-2px); box-shadow:0 2px 4px rgba(30,25,10,.07), 0 10px 24px rgba(30,25,10,.09);} }
  .date{flex:0 0 58px; text-align:center; font-weight:800;}
  .date .num{font-size:26px; line-height:1; display:block;}
  .date .num.small{font-size:15px; line-height:1.25;}
  .date .dow{font-size:10px; letter-spacing:1.2px; color:var(--muted); font-weight:700; display:block; margin-top:3px;}
  .info{min-width:0; flex:1;}
  .info .title{display:block; font-weight:800; font-size:15.5px; line-height:1.25;}
  .info .ru{display:block; color:var(--muted); font-size:13px; font-weight:600; margin-top:3px; line-height:1.35;}
  .info .meta{display:block; font-size:12px; font-weight:700; margin-top:5px; color:var(--ink); opacity:.75;}
  .arrow{margin-left:auto; flex:0 0 auto; color:var(--muted); font-weight:800;}

  /* Прошлые месяцы — свёрнутый блок под текущим списком */
  .archive{margin-top:28px;}
  .archive summary{
    display:flex; align-items:center; gap:14px; cursor:pointer; list-style:none;
    background:rgba(28,28,28,.055); border-radius:18px; padding:14px 16px;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  .archive summary::-webkit-details-marker{display:none;}
  .archive summary::marker{content:"";}
  .archive summary:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .archive .arch-label{display:block; font-size:10px; letter-spacing:1.5px; font-weight:800; color:var(--muted);}
  .archive .arch-title{display:block; font-size:15.5px; font-weight:800; margin-top:3px; line-height:1.25;}
  .archive .arch-title .arch-count{color:var(--muted); font-weight:700; white-space:nowrap;}
  .archive .arch-hint{margin-left:auto; flex:0 0 auto; display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:700;}
  .archive .arch-hint .hide{display:none;}
  .archive[open] .arch-hint .show{display:none;}
  .archive[open] .arch-hint .hide{display:inline;}
  .archive .chev{display:inline-block; font-size:16px; font-weight:800; transform:rotate(90deg); transition:transform .2s ease;}
  .archive[open] .chev{transform:rotate(-90deg);}
  .archive .past{padding-bottom:4px;}

  footer{text-align:center; margin-top:26px; color:var(--muted); font-size:13px; font-weight:600;}
  footer a{color:var(--ink); font-weight:800; text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span>q</span><span>a</span><span>r</span><span>a</span><span>v</span><span>a</span><span>n</span></div><br>

    <p class="sub">Жмите на событие — внутри детали и регистрация 🧡</p>
  </header>

  <div id="archive"></div>
  <footer>
    <a href="https://qaravan.org">qaravan.org</a>

//
//  1. Откройте файл index.html в репозитории на GitHub

//     (и, в начале месяца, MONTH_BADGE / MONTH_TITLE).

//     • Добавить — скопируйте любой блок и поправьте текст.
//     • Несколько дат в одной карточке (как у группы поддержки):

// ── Дальше ничего менять не нужно ─────────────────────────────
const COLORS = ["#E8890C", "#7B4FD8", "#2196D9", "#2E9E44", "#E23838"];
document.getElementById("badge").textContent = MONTH_BADGE;
document.getElementById("title").textContent = MONTH_TITLE;
document.title = "События QARAVAN — " + MONTH_BADGE.toLowerCase();

function renderCards(events) {
  return events.map((e, i) => {
    const color = COLORS[i % COLORS.length];
    const small = e.date.length > 3 ? " small" : "";
    return `<a class="card" href="${e.link}">
    <span class="date"><span class="num${small}" style="color:${color}">${e.date}</span><span class="dow">${e.day}</span></span>
    <span class="info">
      <span class="title">${e.title}</span>
      <span class="ru">${e.ru}</span>
      <span class="meta">${e.meta}</span>
    </span>
    <span class="arrow">›</span>
  </a>`;
  }).join("");
}

function plural(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return n + " событие";
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return n + " события";
  return n + " событий";
}

document.getElementById("list").innerHTML = renderCards(EVENTS);
document.getElementById("archive").innerHTML = ARCHIVE.map(m => `<details class="archive">
    <summary>
      <span class="arch-info">
        <span class="arch-label">${m.badge}</span>
        <span class="arch-title">${m.title} <span class="arch-count">· ${plural(m.events.length)}</span></span>
      </span>
      <span class="arch-hint"><span class="show">Показать</span><span class="hide">Скрыть</span> <span class="chev">›</span></span>
    </summary>
    <div class="past">${renderCards(m.events)}</div>
  </details>`).join("");
</script>
</body>
</html>
